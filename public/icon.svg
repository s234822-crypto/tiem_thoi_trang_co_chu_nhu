<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F4"/>
      <stop offset="100%" stop-color="#F4C7D9"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D87C9B"/>
      <stop offset="100%" stop-color="#C96C8A"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6F554A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Inner Soft Circle Border -->
  <circle cx="256" cy="256" r="210" fill="#FFFFFF" opacity="0.85" filter="url(#soft-shadow)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#F4C7D9" stroke-width="6" stroke-dasharray="12 8"/>

  <!-- Hanger Hook & Body -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Hook -->
    <path d="M 0,-115 C -25,-115 -35,-85 -10,-70 C 5,-60 5,-40 0,-30" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Cute Dress Body -->
    <path d="M -40,-25 L -20,-15 L -20,20 L -80,110 Q 0,135 80,110 L 20,20 L 20,-15 L 40,-25 Q 0,-35 -40,-25 Z" fill="url(#rose-grad)" filter="url(#soft-shadow)"/>
    
    <!-- Belt / Bow Accent -->
    <rect x="-24" y="16" width="48" height="12" rx="6" fill="url(#gold-grad)"/>
    <circle cx="0" cy="22" r="7" fill="#FFFFFF"/>
    
    <!-- Sparkles -->
    <path d="M -90,-20 Q -90,0 -110,0 Q -90,0 -90,20 Q -90,0 -70,0 Q -90,0 -90,-20 Z" fill="#D9A441"/>
    <path d="M 95,-35 Q 95,-20 80,-20 Q 95,-20 95,-5 Q 95,-20 110,-20 Q 95,-20 95,-35 Z" fill="#D87C9B"/>
    <path d="M 85,80 Q 85,90 75,90 Q 85,90 85,100 Q 85,90 95,90 Q 85,90 85,80 Z" fill="#D9A441"/>
  </g>

  <!-- Crown on Top -->
  <path d="M 216,95 L 236,115 L 256,80 L 276,115 L 296,95 L 290,130 L 222,130 Z" fill="url(#gold-grad)"/>
  <circle cx="216" cy="90" r="5" fill="#FFE082"/>
  <circle cx="256" cy="75" r="6" fill="#FFFFFF"/>
  <circle cx="296" cy="90" r="5" fill="#FFE082"/>
</svg>
